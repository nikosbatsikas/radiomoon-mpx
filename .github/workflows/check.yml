# Build check for work branches (every branch except main): compiles both programs on Linux and Windows and runs
# the unit tests. Nothing is published. Releases are built by release.yml when the version changes on main.
name: check
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build and test
        shell: bash
        run: |
          set +e
          cargo build --release -p radiomoon-mpx -p radiomoon_mpx_clap --message-format=short 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          ERR=$(grep -E ': error' build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          WARN=$(grep -E ': warning' build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          [ -n "$ERR" ] && echo "::error title=Compiler errors::$ERR"
          [ -n "$WARN" ] && echo "::warning title=Compiler warnings::$WARN"
          [ $RC -eq 0 ] || exit $RC
          cargo test --release --lib
          ls -l target/release/libradiomoon_mpx_clap.so
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p radiomoon-mpx -p radiomoon_mpx_clap

  headless-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the headless editions on AlmaLinux 8 (glibc 2.28, runs on old and new systems)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src almalinux:8 sh packaging/headless/build-glibc.sh > glibc.log 2>&1
          RC=$?; cat glibc.log
          [ $RC -eq 0 ] || { echo "::error title=glibc build::$(grep -v Compiling glibc.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit $RC; }
          echo "::notice title=glibc build::needs $(tail -n1 glibc.log)"
      - name: Run them on AlmaLinux 9 and 10, Debian 12, Ubuntu 22.04 and 24.04
        shell: bash
        run: |
          set +e
          sudo chown -R $(id -u) target/glibc
          cat > runtest.sh <<'EOF'
          (command -v dnf >/dev/null && dnf install -y -q alsa-lib >/dev/null 2>&1) || (apt-get update -qq >/dev/null 2>&1 && (apt-get install -y -qq libasound2 >/dev/null 2>&1 || apt-get install -y -qq libasound2t64 >/dev/null 2>&1))
          /b/radiomoon-mpx-rxd --version || exit 1
          mkdir -p /tmp/d
          /b/radiomoon-mpx-rxd --data /tmp/d --listen 127.0.0.1:8081 >/tmp/log 2>&1 &
          sleep 4
          # a small HTTP request without curl: bash's /dev/tcp is not in every image, so use the program's own answer
          if command -v curl >/dev/null; then curl -s -o /dev/null -w "page %{http_code}\n" http://127.0.0.1:8081/; else
            (exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3) 2>/dev/null || echo "no curl"; fi
          echo "--- log"; head -n 3 /tmp/log
          EOF
          FAIL=0
          for IMG in almalinux:9 almalinux:10 debian:12 ubuntu:22.04 ubuntu:24.04; do
            OUT=$(docker run --rm -v "$PWD/target/glibc/release":/b -v "$PWD/runtest.sh":/t.sh "$IMG" bash /t.sh 2>&1)
            echo "== $IMG"; echo "$OUT"
            if echo "$OUT" | grep -q "1.11\|RadioMoon"  && echo "$OUT" | grep -q "200\|Web interface on"; then
              echo "::notice title=$IMG::$(echo "$OUT" | tr '\n' ' ' | head -c 300)"
            else
              echo "::error title=$IMG::$(echo "$OUT" | tr '\n' ' ' | head -c 600)"; FAIL=1
            fi
          done
          exit $FAIL
      - name: Unit tests without the windows
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          cargo test --release --lib --no-default-features
      - name: Install with the installer (systemd) and check the web interfaces
        shell: bash
        run: |
          mkdir -p pkg && cp target/glibc/release/radiomoon-mpx-txd target/glibc/release/radiomoon-mpx-rxd packaging/headless/install.sh pkg/
          sudo RM_PASSWORD=secret-pass-1 sh pkg/install.sh both
          sleep 3
          systemctl --no-pager status radiomoon-mpx-rxd radiomoon-mpx-txd | head -30 || true
          curl -sf -o /dev/null http://127.0.0.1:8081/
          curl -sf -c cj -H "X-RadioMoon: 1" -X POST -d '{"user":"admin","password":"secret-pass-1"}' http://127.0.0.1:8081/api/login | grep -q ok
          curl -sf -b cj -o rx.json http://127.0.0.1:8081/api/status; head -c 200 rx.json; echo
          curl -sf -c cj2 -H "X-RadioMoon: 1" -X POST -d '{"user":"admin","password":"secret-pass-1"}' http://127.0.0.1:8080/api/login | grep -q ok
          curl -sf -b cj2 -o tx.json http://127.0.0.1:8080/api/status; head -c 200 tx.json; echo
          echo "::notice title=systemd install test::$(head -c 300 rx.json)"
          sudo journalctl -u radiomoon-mpx-rxd --no-pager > j.txt || true; tail -5 j.txt
          sudo sh pkg/install.sh uninstall

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build on Alpine (musl) and test the installer with OpenRC
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh packaging/headless/build-alpine.sh > alpine.log 2>&1
          RC=$?
          # the install test in a fresh container: no compiler or build libraries, like a new Alpine installation
          [ $RC -eq 0 ] && { docker run --rm -v "$PWD":/src:ro -w /src alpine:3.20 sh packaging/headless/ci-alpine-test.sh >> alpine.log 2>&1; RC=$?; }
          cat alpine.log
          if [ $RC -ne 0 ]; then
            T=$(grep -v "^\s*Compiling\|^\s*Downloaded\|^\s*Downloading" alpine.log | tail -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Alpine build / install test::$T"
          else
            T=$(grep -A40 "== results" alpine.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::notice title=Alpine install test::$T"
          fi
          exit $RC
