# Builds every edition when a version tag is pushed (auto-tag.yml creates the tag and the release when the version
# in Cargo.toml changes on main). The packages are attached to that release:
#   Windows x64/x86/arm64: setup .exe and portable .zip (both programs)
#   Linux x64/arm64:       transmitter .tar.gz and receiver .tar.gz (arm64 = Raspberry Pi 3/4/5, 64-bit OS)
#   macOS arm64:           .dmg with both apps
#   Headless (web interface): Debian / Ubuntu / Raspberry Pi OS and Alpine, x64 / arm64 (names without the version,
#   so that .../releases/latest/download/<name> always gives the newest)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Unit tests (FLAC codec, packet handling, RDS)
        run: cargo test --release --lib

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build setup and portable zip
        shell: pwsh
        run: ./build_windows.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --release -p radiomoon-mpx -p radiomoon_mpx_clap --message-format=short 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          ERR=$(grep -E ': error' build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          WARN=$(grep -E ': warning' build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          [ -n "$ERR" ] && echo "::error title=Compiler errors::$ERR"
          [ -n "$WARN" ] && echo "::warning title=Compiler warnings::$WARN"
          exit $RC
      - name: Packages
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist RadioMoon-MPX-Receiver RadioMoon-MPX-Transmitter
          cp target/release/radiomoon-mpx-receiver README.md CHANGELOG.md RadioMoon-MPX-Receiver/
          cp target/release/radiomoon-mpx-transmitter README.md CHANGELOG.md RadioMoon-MPX-Transmitter/
          cp target/release/libradiomoon_mpx_clap.so RadioMoon-MPX-Transmitter/RadioMoon-MPX-Transmitter.clap
          tar czf dist/RadioMoon-MPX-Receiver-$V-linux-${{ matrix.arch }}.tar.gz RadioMoon-MPX-Receiver
          tar czf dist/RadioMoon-MPX-Transmitter-$V-linux-${{ matrix.arch }}.tar.gz RadioMoon-MPX-Transmitter
      - name: Headless edition (web interface; built on AlmaLinux 8 for Debian / Ubuntu / Raspberry Pi OS / AlmaLinux / RHEL)
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          docker run --rm -v "$PWD":/src -w /src almalinux:8 sh packaging/headless/build-glibc.sh
          sudo chown -R $(id -u) target
          D=RadioMoon-MPX-Headless-$V
          mkdir -p $D
          cp target/glibc/release/radiomoon-mpx-txd target/glibc/release/radiomoon-mpx-rxd packaging/headless/install.sh packaging/headless/README.txt CHANGELOG.md $D/
          tar czf dist/RadioMoon-MPX-Headless-linux-${{ matrix.arch }}.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  alpine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build on Alpine (musl)
        run: docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh packaging/headless/build-alpine.sh
      - name: Package
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          D=RadioMoon-MPX-Headless-$V
          mkdir -p dist $D
          sudo cp target/alpine/release/radiomoon-mpx-txd target/alpine/release/radiomoon-mpx-rxd $D/
          sudo chown -R $(id -u) $D
          cp packaging/headless/install.sh packaging/headless/README.txt CHANGELOG.md $D/
          tar czf dist/RadioMoon-MPX-Headless-alpine-${{ matrix.arch }}.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: alpine-${{ matrix.arch }}
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p radiomoon-mpx -p radiomoon_mpx_clap
      - name: App bundles and dmg
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/dmg
          for P in "Transmitter:radiomoon-mpx-transmitter" "Receiver:radiomoon-mpx-receiver"; do
            NAME="RadioMoon MPX ${P%%:*}"; BIN="${P##*:}"; EXE="RadioMoon-MPX-${P%%:*}"
            LOW=$(echo ${P%%:*} | tr A-Z a-z)
            rm -rf icon.iconset && mkdir icon.iconset
            for s in 16 32 64 128 256; do sips -z $s $s packaging/$LOW.png --out icon.iconset/icon_${s}x${s}.png; done
            APP="dist/dmg/$NAME.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp target/release/$BIN "$APP/Contents/MacOS/$EXE"
            iconutil -c icns icon.iconset -o "$APP/Contents/Resources/RadioMoon.icns"
            sed -e "s/@VERSION@/$V/g" -e "s/@NAME@/$NAME/g" -e "s/@EXE@/$EXE/g" -e "s/@ID@/com.radiomoon.mpx.$(echo ${P%%:*} | tr A-Z a-z)/g" packaging/macos/Info.plist.in > "$APP/Contents/Info.plist"
          done
          # the CLAP plug-in bundle (copy it to /Library/Audio/Plug-Ins/CLAP or ~/Library/Audio/Plug-Ins/CLAP)
          CLAP="dist/dmg/RadioMoon MPX Transmitter.clap"
          mkdir -p "$CLAP/Contents/MacOS"
          cp target/release/libradiomoon_mpx_clap.dylib "$CLAP/Contents/MacOS/RadioMoon-MPX-Transmitter"
          sed -e "s/@VERSION@/$V/g" packaging/macos/Clap.plist.in > "$CLAP/Contents/Info.plist"
          printf 'BNDL????' > "$CLAP/Contents/PkgInfo"
          codesign --force --sign - "$CLAP" || true
          hdiutil create -volname "RadioMoon MPX" -srcfolder dist/dmg -ov -format UDZO dist/RadioMoon-MPX-$V-macos-arm64.dmg
          rm -rf dist/dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  release:
    needs: [test, windows, linux, alpine, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check that the tag matches the program version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $V"; exit 1; }
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          awk -v v="$V" '$0 ~ "^## " v "([^0-9.]|$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "RadioMoon MPX $V" > notes.md
      - name: Attach the packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 24); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && FOUND=1 && break
            sleep 5
          done
          [ -n "$FOUND" ] || { echo "No release for tag $TAG."; exit 1; }
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
