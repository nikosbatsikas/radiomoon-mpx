[package]
name = "radiomoon-mpx"
version = "1.14.0"
edition = "2021"
description = "RadioMoon MPX - FM multiplex transmitter and receiver (stereo, RDS, L24 / lossless FLAC over IP)"
license = "LicenseRef-RadioMoon"
build = "build.rs"
default-run = "radiomoon-mpx-transmitter"

[lib]
name = "radiomoon_mpx"
path = "src/lib.rs"

[[bin]]
name = "radiomoon-mpx-transmitter"
path = "src/bin/mpx_transmitter.rs"
required-features = ["gui"]

[[bin]]
name = "radiomoon-mpx-receiver"
path = "src/bin/mpx_receiver.rs"
required-features = ["gui"]

# headless editions (Linux, Raspberry Pi, Alpine): no window, a web interface instead
[[bin]]
name = "radiomoon-mpx-txd"
path = "src/bin/mpx_txd.rs"

[[bin]]
name = "radiomoon-mpx-rxd"
path = "src/bin/mpx_rxd.rs"

[features]
default = ["gui"]
# the windows of the two programs (egui), the tray icon and the file dialogs
gui = ["dep:eframe", "dep:image", "dep:rfd", "dep:raw-window-handle", "dep:tray-icon"]

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", optional = true }
ureq = "2"
socket2 = "0.5"
raw-window-handle = { version = "0.6", optional = true }
opus = "0.4"
serialport = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tray-icon = { version = "=0.26.1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }

[workspace]
members = [".", "clap-plugin"]
default-members = ["."]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
