[package]
name = "radiomoon-mpx"
version = "1.3.0"
edition = "2021"
description = "RadioMoon MPX - FM multiplex transmitter and receiver (stereo, RDS, L24 / lossless FLAC over IP)"
license = "LicenseRef-RadioMoon"
build = "build.rs"
default-run = "radiomoon-mpx-transmitter"

[lib]
name = "radiomoon_mpx"
path = "src/lib.rs"

[[bin]]
name = "radiomoon-mpx-transmitter"
path = "src/bin/mpx_transmitter.rs"

[[bin]]
name = "radiomoon-mpx-receiver"
path = "src/bin/mpx_receiver.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = "2"
socket2 = "0.5"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
